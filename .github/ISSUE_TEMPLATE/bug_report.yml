name: Bug Report
description: Report a reproducible bug in AlphaForge
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue quickly.

        **Do not report security vulnerabilities here** — see our
        [Security Policy](https://github.com/ROROK20/AlphaForge/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this has not been reported.
          required: true
        - label: I am running a supported version (0.1.x).
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal code snippet or commands that reproduce the issue.
      placeholder: |
        1. Run `alphaforge backtest --symbol AAPL ...`
        2. Observe ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / traceback
      description: What actually happened? Paste the full error traceback if applicable.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: AlphaForge version
      description: Output of `python -c "import alphaforge; print(alphaforge.__version__)"`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.5"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (screenshots, data details, config).
    validations:
      required: false
