name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # `.[dev]` deliberately excludes the `torch` extra, so the LSTMSignal
      # tests importorskip torch and SKIP in this job; that is the intended CI
      # reading. The zero-skip run needs `pip install -e ".[dev,torch]"` — a
      # ~2.5 GB torch download is not made the default developer install.
      # Current counts for both installs: README "Testing" (one count site).
      # The matrix must equal pyproject.toml's classifiers
      # (tests/test_packaging.py enforces it): pandas 3 / numpy 2.4 need 3.11+.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ --cov=alphaforge --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Exact pin: an unpinned install picks up whatever ruff is newest, and
      # the rule set lives in pyproject.toml ([tool.ruff.lint]) so a new
      # default selection cannot change what this job enforces either.
      - name: Install ruff
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check alphaforge/ --ignore E501,E402

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Built with no NEXT_PUBLIC_* variables, as a misconfigured deploy would
      # be: the page must ship no localhost URL and claim no data mode.
      - name: Check production build
        run: npm run check:prerender
