[build-system]
# setuptools >= 83: PYSEC-2026-3447 (MANIFEST.in exclude rules bypassed by NFC/NFD
# mismatch on macOS APFS, so an excluded file can be packed into a published sdist)
# is fixed in 83.0.0. Build-time only.
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

# This file is the ONE source of package metadata; setup.py is a bare shim that
# declares nothing. tests/test_packaging.py pins every claim in this file against
# requirements.txt, CI, the Dockerfile and the README badge.

[project]
name = "alphaforge"
version = "0.1.0"
description = "Python backtesting framework that keeps itself honest, with ML signals, portfolio optimization and a web dashboard"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rohan Khiani", email = "rskv.khiani@gmail.com"}]
# 3.11, not 3.10: the tested floors below (pandas 3.0, numpy 2.4, scipy 1.17,
# scikit-learn 1.8) all declare Requires-Python >=3.11, so a 3.10 interpreter
# cannot install the set this project is actually tested against.
requires-python = ">=3.11"
keywords = ["quantitative", "trading", "backtesting", "finance", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Floors, not hard pins: a library that `==`-pins its dependencies makes itself
# uninstallable next to anything else. Every floor is EXACTLY the version
# pinned in requirements.txt, i.e. the version the suite is run green against.
dependencies = [
    "yfinance>=1.4.1",
    "pandas>=3.0.3",
    "numpy>=2.4.6",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "rich>=15.0.0",
    "click>=8.4.1",
    "python-dotenv>=1.2.2",
    "pyarrow>=24.0.0",
    "requests>=2.34.2",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
torch = ["torch>=2.13.0"]
# Not raised: alpaca-trade-api is not installed in the tested environment, so
# there is no verified-green version to raise this floor to (see SECURITY.md).
live = ["alpaca-trade-api>=3.1.0,<4"]
# `[dev]` deliberately does NOT pull torch: the LSTM tests importorskip it and
# skip. Install `.[dev,torch]` for the zero-skip run (counts: README "Testing").
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "jupyter>=1.0.0", "httpx>=0.28.1"]

[project.scripts]
alphaforge = "alphaforge.cli:main"
alphaforge-api = "alphaforge.api.app:main"

[project.urls]
Homepage = "https://github.com/ROROK20/AlphaForge"
Repository = "https://github.com/ROROK20/AlphaForge"
"Bug Tracker" = "https://github.com/ROROK20/AlphaForge/issues"

[tool.setuptools.packages.find]
# Ships `alphaforge` and `strategies` (the README imports `strategies.ml_momentum`)
# and nothing else.
# `namespaces = false` matters: pyproject's finder defaults to namespace
# discovery, which would pack `frontend/` and any stray `build/` into the wheel.
include = ["alphaforge", "alphaforge.*", "strategies", "strategies.*"]
namespaces = false

# Lint: the enforced rule set is EXPLICIT, because ruff's DEFAULT selection is not
# stable across releases. CI pins the ruff version AND the rules live here, so
# neither a new release nor a new default can flip CI: pycodestyle E4/E7/E9 +
# pyflakes F, minus E402/E501.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["alphaforge"]
omit = ["tests/*", "notebooks/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if TYPE_CHECKING"]
